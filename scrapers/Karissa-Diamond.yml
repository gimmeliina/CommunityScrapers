name: "Karissa Diamond"
sceneByURL:
  - action: scrapeXPath
    url:
      - karissa-diamond.com/videoCollection
    scraper: sceneScraper

galleryByURL:
  - action: scrapeXPath
    url:
      - karissa-diamond.com/photoCollection
    scraper: galleryScraper

xPathScrapers:
  sceneScraper:
    scene:
      Title: //div[@id="setTitle"]/text()
      URLs: //meta[@property='og:url']/@content
      Studio:
        Name:
          fixed: "Karissa Diamond"
      Date:
        selector: //div[@id="setDate"]/text()
        postProcess:
          - parseDate: January 02, 2006
      Tags:
        Name: //div[@class[contains(.,'hidden')]]//a[@class='tag']/text()
      Performers:
        Name:
          fixed: "Karissa Diamond"
      Image: //meta[@property="og:image"]/@content
  galleryScraper:
    gallery:
      Title: //div[@id="setTitle"]/text()
      URLs: //meta[@property="og:url"]/@content
      Studio:
        Name:
          fixed: "Karissa Diamond"
      Date:
        selector: //div[@id="setDate"]/text()
        postProcess:
          - parseDate: January 02, 2006
      Tags:
        Name: //div[@class[contains(.,"hidden")]]//a[@class="tag"]/text()
      Performers:
        Name:
          fixed: "Karissa Diamond"
